<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="8" fill="#1D4ED8"/>
  <!-- Rising bar chart (3 bars, left to right, taller = more visible impact) -->
  <rect x="6" y="20" width="4" height="6" rx="1" fill="white" opacity="0.5"/>
  <rect x="12" y="15" width="4" height="11" rx="1" fill="white" opacity="0.75"/>
  <rect x="18" y="9" width="4" height="17" rx="1" fill="white"/>
  <!-- Checkmark over the tallest bar — proof -->
  <path d="M21 7 L23.5 10 L27 5" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
